samba:
  server_string: "Polaris"
  icon: "RackMac"
  workgroup: "WORKGROUP"
  veto_files:
    - "._*"
    - ".DS_Store"
    - "Thumbs.db"
    - "*.icloud"
    - ".metadata"
    - ".localized"
    - ".Spotlight-V100"
    - ".Trashes"
    - ".fseventsd"
    - ".DocumentRevisions-V100"
  shares:
    - name: "downloads"
      path: "{{ home_directory }}/downloads"
      guest: false
      read_only: false
