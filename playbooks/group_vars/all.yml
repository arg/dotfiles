ansible_ssh_common_args: '-o "SetEnv TERM=dumb"'
ansible_user: "arg"

scripts_directory: "/usr/local/bin"
home_directory: "/home/{{ ansible_user }}"
docker_directory: "{{ home_directory }}/docker"
server_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
server_network_prefix: "{{ ansible_facts['default_ipv4']['prefix'] }}"
server_network: "{{ ansible_facts['default_ipv4']['network'] }}/{{ server_network_prefix }}"
