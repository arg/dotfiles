- name: "Create Samba share directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ samba.shares }}"
  loop_control:
    label: "{{ item.path }}"

- name: "Configure Samba"
  ansible.builtin.template:
    src: "samba/smb.conf.j2"
    dest: "/etc/samba/smb.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  register: "samba_config"

- name: "Restart Samba"
  ansible.builtin.systemd_service:
    name: "smbd"
    state: "restarted"
    enabled: true
  when: "samba_config.changed"

- name: "Check Samba user"
  ansible.builtin.command:
    cmd: "pdbedit --user={{ ansible_user }}"
  register: "samba_user"
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Create Samba user"
  ansible.builtin.command:
    cmd: "smbpasswd -s -a {{ ansible_user }}"
    stdin: "{{ secrets.samba.password }}\n{{ secrets.samba.password }}"
  when: "samba_user.rc != 0"
  no_log: true

- name: "Configure Avahi SMB service"
  ansible.builtin.template:
    src: "samba/avahi-smb.service.j2"
    dest: "/etc/avahi/services/smb.service"
    owner: "root"
    group: "root"
    mode: "0644"
  register: "avahi_smb_service"

- name: "Restart Avahi daemon"
  ansible.builtin.systemd_service:
    name: "avahi-daemon"
    state: "restarted"
    enabled: true
  when: "avahi_smb_service.changed"
